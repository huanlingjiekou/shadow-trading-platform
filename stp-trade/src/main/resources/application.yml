# ==================== 服务配置 ====================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /stp-trade

spring:
  application:
    name: stp-trade
  profiles:
    active: dev

  # ==================== 数据源 (环境变量引入) ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stp_trade}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  # ==================== RabbitMQ (环境变量引入) ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 消息确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3

  # ==================== Redis (Redisson 读取此项) ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shadowtradingplatform.trade.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Redisson (环境变量引入) ====================
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:null}
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 3000
      timeout: 3000

# ==================== Knife4j / OpenAPI3 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.shadowtradingplatform.trade

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: 192.168.1.1:8080
    enable-home: true
    home-text: "Shadow Trading Platform - Trade Module API"
    enable-open-api: false
    enable-debug: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "Apache License 2.0 | Copyright 2026 Shadow Trading Platform"

# ==================== 微信支付 (环境变量引入) ====================
wechat:
  pay:
    # 商户号
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    # 商户API证书序列号
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    # 商户API V3密钥
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    # 商户私钥文件路径
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    # 微信支付平台证书路径
    cert-path: ${WECHAT_PAY_CERT_PATH:}
    # 支付通知地址
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.shadowtradingplatform.trade: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
