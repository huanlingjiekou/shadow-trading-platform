# ==================== 服务配置 ====================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path:

spring:
  application:
    name: stp-trade
  profiles:
    active: dev

  # ==================== 数据源 (环境变量引入) ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stp_trade}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  # ==================== RabbitMQ (环境变量引入) ====================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 消息确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3

  # ==================== Redis (Redisson 读取此项) ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shadowtradingplatform.trade.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Redisson (环境变量引入) ====================
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:null}
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 3000
      timeout: 3000

# ==================== Knife4j / OpenAPI3 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.shadowtradingplatform.trade

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: 192.168.1.1:8080
    enable-home: true
    home-text: "Shadow Trading Platform - Trade Module API"
    enable-open-api: false
    enable-debug: true
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "Apache License 2.0 | Copyright 2026 Shadow Trading Platform"

# ==================== 业务配置 (登录解密用 RSA 私钥等) ====================
business:
  # 业务 RSA 私钥 (PKCS8 格式字符串，用于解密登录请求 encryptedKey)
  # 来源：.env 文件 BUSINESS_PRIVATE_KEY 环境变量
  private-key: ${BUSINESS_PRIVATE_KEY:}

# ==================== 支付宝配置 (IJPay, 环境变量引入) ====================
alipay:
  # 应用ID
  app-id: ${ALIPAY_APP_ID:}
  # 应用私钥 (PKCS8 格式字符串)
  private-key: ${ALIPAY_PRIVATE_KEY:}
  # 支付宝公钥 (用于验签)
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 网关地址 (沙箱: https://openapi-sandbox.dl.alipaydev.com/gateway.do | 正式: https://openapi.alipay.com/gateway.do)
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
  # 编码
  charset: ${ALIPAY_CHARSET:UTF-8}
  # 数据格式
  format: ${ALIPAY_FORMAT:JSON}
  # 签名类型
  sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
  # 异步通知回调地址
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 同步返回地址
  return-url: ${ALIPAY_RETURN_URL:}
  # Mock 模式开关 (环境变量 ALIPAY_MOCK_ENABLED 控制)
  # true: 不发送真实网络请求，返回模拟支付链接/二维码
  # false: 走真实支付宝接口
  mock-enabled: ${ALIPAY_MOCK_ENABLED:true}

# ==================== 微信支付配置 (IJPay Api-v3, 环境变量引入) ====================
wechat:
  pay:
    # 应用ID (公众号/小程序/APP)
    app-id: ${WECHAT_PAY_APP_ID:}
    # 商户号
    mch-id: ${WECHAT_PAY_MCH_ID:}
    # 商户API证书序列号
    mch-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
    # 商户API V3密钥 (32位字符，用于AES-GCM加解密)
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    # 商户私钥文件路径 (apiclient_key.pem)
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    # 商户证书文件路径 (apiclient_cert.pem)
    cert-path: ${WECHAT_PAY_CERT_PATH:}
    # 微信支付平台证书路径 (wxp_platform_cert.pem, 用于验签)
    platform-cert-path: ${WECHAT_PAY_PLATFORM_CERT_PATH:}
    # 支付通知地址
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    # Mock 模式开关 (环境变量 WECHAT_PAY_MOCK_ENABLED 控制)
    # true: 不发送真实网络请求，返回模拟 prepay_id
    # false: 走真实微信支付接口
    mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:true}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.shadowtradingplatform.trade: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
