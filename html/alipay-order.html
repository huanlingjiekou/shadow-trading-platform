<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝下单测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 560px;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        label .required {
            color: #ff4d4f;
            margin-right: 2px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }
        input:disabled {
            background: #f5f5f5;
            color: #999;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row > div {
            flex: 1;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(22, 119, 255, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .submit-btn .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        .result.success {
            display: block;
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #0050b3;
        }
        .result.error {
            display: block;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #a8071a;
        }
        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .result pre {
            white-space: pre-wrap;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.04);
            padding: 10px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .form-container {
            margin-top: 16px;
            padding: 16px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            display: none;
        }
        .form-container.visible {
            display: block;
        }
        .form-container .tip {
            font-size: 13px;
            color: #389e0d;
            margin-bottom: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">支</div>
            <h1>支付宝下单测试</h1>
            <p class="subtitle">POST /stp-trade/alipay/order</p>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label><span class="required">*</span>商户订单号 outTradeNo</label>
                <input type="text" id="outTradeNo" value="" required>
                <div class="hint">商户自定义，全局唯一。留空则自动按时间戳生成</div>
            </div>

            <div class="form-group">
                <label><span class="required">*</span>订单标题 subject</label>
                <input type="text" id="subject" value="Shadow 平台会员服务" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label><span class="required">*</span>订单金额 totalAmount (元)</label>
                    <input type="number" id="totalAmount" step="0.01" min="0.01" value="0.01" required>
                </div>
                <div class="form-group">
                    <label><span class="required">*</span>交易类型 tradeType</label>
                    <select id="tradeType" required>
                        <option value="WEB" selected>WEB - 电脑网站支付</option>
                        <option value="WAP">WAP - 手机网站支付</option>
                        <option value="SCAN">SCAN - 当面付扫码</option>
                        <option value="APP">APP - APP支付</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>商品描述 body</label>
                <input type="text" id="body" value="会员服务 1 个月">
            </div>

            <div class="form-group">
                <label>买家支付宝ID buyerId</label>
                <input type="text" id="buyerId" value="2088722107259663">
                <div class="hint" id="buyerIdHint">当面付预下单时可空，沙箱默认买家账号</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>立即下单并跳转支付宝支付</span>
            </button>
        </form>

        <div class="result" id="resultBox"></div>

        <div class="form-container" id="formContainer">
            <div class="tip">✅ 已接收到支付宝返回的支付 form，即将自动跳转...</div>
            <div id="formRenderArea"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/stp-trade';

        // 枚举映射：字符串 -> TradeTypeEnum
        const tradeTypeMap = {
            'WEB': 'WEB',
            'WAP': 'WAP',
            'SCAN': 'SCAN',
            'APP': 'APP'
        };

        // 根据交易类型动态启用/禁用 buyerId 字段
        // 仅 SCAN 当面付支持 buyer_id，WEB/WAP/APP 传该参数会报 INVALID_PARAMETER
        function updateBuyerIdState() {
            const tradeType = document.getElementById('tradeType').value;
            const buyerIdInput = document.getElementById('buyerId');
            const buyerIdHint = document.getElementById('buyerIdHint');
            if (tradeType === 'SCAN') {
                buyerIdInput.disabled = false;
                buyerIdHint.textContent = '可选。当面付预下单时指定买家';
            } else {
                buyerIdInput.disabled = true;
                buyerIdHint.textContent = '当前交易类型不支持 buyer_id，已自动忽略（传了会报 INVALID_PARAMETER）';
            }
        }
        document.getElementById('tradeType').addEventListener('change', updateBuyerIdState);
        updateBuyerIdState();

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const outTradeNoInput = document.getElementById('outTradeNo');
            let outTradeNo = outTradeNoInput.value.trim();
            if (!outTradeNo) {
                // 自动按时间戳生成，避免订单号重复导致下单失败
                const d = new Date();
                const pad = n => String(n).padStart(2, '0');
                outTradeNo = `ALI${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
                outTradeNoInput.value = outTradeNo;
            }
            const subject = document.getElementById('subject').value.trim();
            const totalAmount = parseFloat(document.getElementById('totalAmount').value);
            const tradeTypeRaw = document.getElementById('tradeType').value;
            const body = document.getElementById('body').value.trim();
            const buyerIdInput = document.getElementById('buyerId');
            const buyerId = buyerIdInput.disabled ? '' : buyerIdInput.value.trim();

            if (!outTradeNo || !subject || isNaN(totalAmount) || totalAmount < 0.01) {
                showResult('error', '参数校验失败', '请检查必填项与金额');
                return;
            }

            // 请求参数使用 snake_case 命名，与后端 Jackson 全局 SNAKE_CASE 策略对齐
            const payload = {
                out_trade_no: outTradeNo,
                subject,
                total_amount: totalAmount,
                trade_type: tradeTypeMap[tradeTypeRaw],
                ...(body ? { body } : {}),
                ...(buyerId ? { buyer_id: buyerId } : {})
            };

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>正在请求支付接口...';

            document.getElementById('formContainer').classList.remove('visible');
            document.getElementById('resultBox').className = 'result';

            try {
                const res = await fetch(`${API_BASE}/alipay/order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (err) {
                    throw new Error('响应不是合法 JSON: ' + text.substring(0, 200));
                }

                if (!res.ok || !data) {
                    throw new Error(data?.message || ('HTTP ' + res.status));
                }

                console.log('接口返回:', data);

                showResult('success', '下单成功', JSON.stringify(data, null, 2));

                // 核心逻辑：处理接口返回的 payUrl（form HTML 字符串）
                // 1. WEB / WAP 类型：payUrl 是完整的 <form> 字符串，自动提交即跳转支付宝
                // 2. SCAN 类型：qrCodeContent 是二维码内容，需生成二维码
                // 3. APP 类型：payUrl / prepayId 是调起参数，交给移动端 SDK
                if (data.payUrl && (tradeTypeRaw === 'WEB' || tradeTypeRaw === 'WAP')) {
                    // 解析后端返回的 form HTML，提取 action URL 和 hidden inputs
                    const formData = extractFormData(data.payUrl);
                    logToBox('提取表单数据', JSON.stringify(formData, null, 2));

                    if (formData && formData.action) {
                        // 创建干净的 form 元素并提交
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = formData.action;
                        form.target = '_self';

                        formData.inputs.forEach(input => {
                            const inputEl = document.createElement('input');
                            inputEl.type = 'hidden';
                            inputEl.name = input.name;
                            inputEl.value = input.value;
                            form.appendChild(inputEl);
                        });

                        document.body.appendChild(form);
                        logToBox('提交表单', `action=${formData.action}\ninputs=${formData.inputs.map(i => i.name + '=' + i.value.substring(0, 80) + '...').join(', ')}`);
                        // 直接提交，跳转支付宝
                        form.submit();
                    } else {
                        // fallback: 直接注入 HTML
                        const formArea = document.getElementById('formRenderArea');
                        formArea.innerHTML = data.payUrl;
                        document.getElementById('formContainer').classList.add('visible');
                        setTimeout(() => {
                            const forms = formArea.querySelectorAll('form');
                            forms.forEach(f => { if (typeof f.submit === 'function') { try { f.submit(); } catch (e) {} } });
                        }, 300);
                    }
                } else if (data.qrCodeContent && tradeTypeRaw === 'SCAN') {
                    document.getElementById('resultBox').innerHTML += `
                        <div style="margin-top:12px; padding:12px; background:#fff; border-radius:6px;">
                            <div style="font-weight:500; margin-bottom:6px;">📱 扫码支付二维码内容：</div>
                            <code style="background:#f5f5f5; padding:6px 8px; border-radius:4px; display:block; word-break:break-all;">
                                ${data.qrCodeContent}
                            </code>
                            <div class="hint" style="margin-top:6px;">
                                前端可基于该内容使用 qrcode.js 等库生成二维码图片
                            </div>
                        </div>
                    `;
                } else if (tradeTypeRaw === 'APP') {
                    document.getElementById('resultBox').innerHTML += `
                        <div style="margin-top:12px; padding:12px; background:#fff; border-radius:6px;">
                            <div style="font-weight:500; margin-bottom:6px;">📱 APP 调起参数：</div>
                            <code style="background:#f5f5f5; padding:6px 8px; border-radius:4px; display:block; word-break:break-all;">
                                ${data.payUrl || data.prepayId || '无'}
                            </code>
                            <div class="hint" style="margin-top:6px;">
                                交给移动端支付宝 SDK 调起即可
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                console.error(err);
                showResult('error', '请求失败', err.message || String(err));
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>立即下单并跳转支付宝支付</span>';
            }
        });

        function showResult(type, title, msg) {
            const box = document.getElementById('resultBox');
            box.className = 'result ' + type;
            const icon = type === 'success' ? '✅' : '❌';
            box.innerHTML = `
                <div class="result-title">${icon} ${title}</div>
                <pre>${escapeHtml(msg)}</pre>
            `;
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s == null ? '' : String(s);
            return div.innerHTML;
        }

        /**
         * 从支付宝 SDK 返回的 form HTML 中提取 action URL 和 hidden 输入字段.
         * 用 DOMParser 解析，避免 innerHTML 注入导致的属性值解析问题.
         */
        function extractFormData(formHtml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(formHtml, 'text/html');
            const form = doc.querySelector('form');
            if (!form) return null;

            const action = form.getAttribute('action') || form.action || '';
            const method = (form.getAttribute('method') || 'POST').toUpperCase();

            const inputs = [];
            const inputEls = form.querySelectorAll('input[type="hidden"]');
            inputEls.forEach(el => {
                inputs.push({
                    name: el.getAttribute('name') || '',
                    value: el.getAttribute('value') || el.value || ''
                });
            });

            return { action, method, inputs };
        }

        /**
         * 在结果区追加调试日志.
         */
        function logToBox(title, msg) {
            const box = document.getElementById('resultBox');
            if (box.style.display === 'none' || !box.className.includes('success')) {
                return;
            }
            box.innerHTML += `
                <div style="margin-top:12px; padding:10px; background:#f6f8fa; border-radius:6px; border-left:3px solid #1677ff;">
                    <div style="font-weight:600; font-size:13px; color:#1677ff; margin-bottom:4px;">${escapeHtml(title)}</div>
                    <pre style="margin:0; white-space:pre-wrap; font-size:12px; font-family:Consolas,Monaco,monospace;">${escapeHtml(msg)}</pre>
                </div>
            `;
        }
    </script>
</body>
</html>
